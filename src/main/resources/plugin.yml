name: SkyStats
version: 0.2.8
main: de.laurinhummel.skystats.main.SkyStats
api-version: 1.18
authors: [ SkyExit ]
description: A Minecraft statistics plugin

commands:
  stats:
    description: Get some information about jour journey
    usage: /stats
  level:
    description: See your Level on the server
    usage: /level
  workbench:
    description: Open a workbench
    usage: /workbench
    aliases: [ wb ]
  enderchest:
    description: Open your enderchest
    usage: /enderchest
    aliases: [ ec ]