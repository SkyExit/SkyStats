name: SkyStats
version: '${project.version}'
main: de.skystats.SkyStatsPlugin
api-version: '1.18'
description: Vanilla statistics, leaderboards and medals
folia-supported: ${folia.supported}
commands:
  stats:
    description: Opens Vanilla statistics and server leaderboards.
    usage: /stats [player]
    permission: stats.use
    permission-message: '§cYou do not have permission to view statistics.'
permissions:
  stats.use:
    description: View your statistics and server leaderboards.
    default: true
  stats.others:
    description: View statistics of other known players.
    default: true
